<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시황 대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <p class="eyebrow">Live · Market Data</p>
      <span class="topbar-title">시황 대시보드</span>
      <span class="topbar-sub mono" id="updated-at">불러오는 중…</span>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="테마 전환">☀️</button>
  </header>

  <main class="explorer">
    <aside class="ticker-nav" id="ticker-nav" aria-label="지표 목록"></aside>

    <section class="chart-panel">
      <div class="chart-panel-header">
        <div class="chart-legend" id="chart-legend"></div>
        <div class="range-controls" id="range-controls"></div>
      </div>
      <div class="chart-toolbar">
        <span class="toolbar-label">이동평균</span>
        <div class="ma-controls" id="ma-controls"></div>
        <span class="toolbar-hint">휠로 확대/축소 · 드래그로 이동 · 클릭으로 포인트 찍기</span>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <canvas id="compare-chart"></canvas>
        <p class="chart-empty" id="chart-empty">왼쪽 목록에서 지표를 선택하세요</p>
        <div class="chart-tooltip" id="chart-tooltip" hidden></div>
      </div>

      <section class="points-panel" id="points-panel" hidden>
        <div class="points-panel-header">
          <span class="toolbar-label">포인트 비교</span>
          <button class="text-btn" id="points-clear" type="button">모두 지우기</button>
        </div>
        <div class="points-list" id="points-list"></div>
        <div class="points-compare" id="points-compare"></div>
      </section>
    </section>
  </main>

  <section class="news-panel" id="news-panel">
    <div class="news-panel-header">
      <span class="toolbar-label">주요 뉴스</span>
      <span class="news-updated mono" id="news-updated"></span>
    </div>
    <div class="news-list" id="news-list"></div>
  </section>

  <footer class="page-footer">
    <p>데이터: Yahoo Finance (yfinance) · 자동 갱신 · <a href="https://github.com/Tim-YonghoShin/dashboard" target="_blank" rel="noopener">소스</a></p>
  </footer>
</div>

<div class="sidebar-tooltip" id="sidebar-tooltip" hidden></div>

<button class="chat-fab" id="chat-fab" type="button" aria-label="차트 도우미 열기">💬</button>

<div class="chat-panel" id="chat-panel" hidden>
  <div class="chat-panel-head">
    <div>
      <span class="chat-title">차트 도우미</span>
      <span class="chat-sub">지금 보고 있는 지표·구간·포인트를 근거로 답해요</span>
    </div>
    <button class="modal-close" id="chat-close" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <form class="chat-input-row" id="chat-form">
    <input class="chat-input" id="chat-input" type="text" placeholder="예: 두 지수 언제부터 벌어졌어?" autocomplete="off">
    <button class="chat-send" type="submit" aria-label="전송">➤</button>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2/dist/chartjs-plugin-zoom.min.js"></script>
<script src="assets/chart.js"></script>
<script src="assets/app.js"></script>
<script src="assets/chat.js"></script>
</body>
</html>
