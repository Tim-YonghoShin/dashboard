<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시황 대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <p class="eyebrow">Live · Market Data</p>
      <span class="topbar-title">시황 대시보드</span>
      <span class="topbar-sub mono" id="updated-at">불러오는 중…</span>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="테마 전환">☀️</button>
  </header>

  <section class="hero" aria-label="핵심 지표 요약">
    <div class="hero-grid" id="hero-grid"></div>
  </section>

  <main id="sections" class="sections" aria-live="polite"></main>

  <footer class="page-footer">
    <p>데이터: Yahoo Finance (yfinance) · 자동 갱신 · <a href="https://github.com/Tim-YonghoShin/dashboard" target="_blank" rel="noopener">소스</a></p>
  </footer>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <div>
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-subtitle" id="modal-subtitle"></p>
      </div>
      <button class="modal-close" id="modal-close" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="range-controls" id="range-controls"></div>
    <div class="modal-chart-wrap">
      <div class="modal-chart" id="modal-chart"></div>
      <p class="modal-loading" id="modal-loading">불러오는 중…</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="assets/chart.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
