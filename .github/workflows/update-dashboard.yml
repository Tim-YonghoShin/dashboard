name: Update dashboard data

on:
  schedule:
    - cron: "0 */6 * * *" # 매일 6시간마다 (UTC) — KST 09:00 / 15:00 / 21:00 / 03:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest market data
        run: python scripts/fetch_market_data.py

      - name: Summarize recent news
        continue-on-error: true # 뉴스 요약이 실패해도(예: 시크릿 미설정) 시세 갱신/커밋은 계속 진행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/summarize_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/news.json
          git diff --cached --quiet || git commit -m "chore: update market data snapshot + news summary"
          git push
