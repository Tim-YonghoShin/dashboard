name: Update historical data

on:
  schedule:
    - cron: "30 21 * * 1-5" # 평일 21:30 UTC (미국 장 마감 이후) — 며칠 밀려도 겹침 구간으로 자동 보정됨
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update history CSVs
        run: python scripts/update_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          git diff --cached --quiet || git commit -m "chore: update historical price data"
          git push
